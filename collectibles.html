<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面玩偶 · 模型预览</title><style>*{box-sizing:border-box}body{margin:0;background:#eee8dc;color:#4c5146;font-family:"Microsoft YaHei",sans-serif}header{padding:35px 5vw 20px}h1{font:30px Georgia,serif;font-weight:400;margin:0 0 12px}p{font-size:12px;color:#827c6d}main{display:grid;grid-template-columns:repeat(2,1fr);max-width:1000px;margin:auto;gap:12px;padding:0 3vw 30px}article{min-width:0}canvas{display:block;width:100%;height:440px;border-radius:12px;touch-action:none}h2{font-size:13px;font-weight:400;letter-spacing:2px;text-align:center}article p{text-align:center;font-size:10px}a{color:inherit;font-size:12px}footer{padding:10px 5vw 30px;font-size:11px;color:#827c6d}@media(max-width:850px){main{grid-template-columns:repeat(2,1fr)}canvas{height:330px}}@media(max-width:450px){canvas{height:260px}header{padding:25px 5vw}}</style></head><body><header><h1>布娃娃摆件</h1><p>实际 3D 模型 · 拖动可旋转查看</p></header><main id="models"></main><footer><a href="./">返回生日房间 ↗</a></footer><script type="module">
import * as T from './vendor/three.module.js';import{createCollectible,collectibleNames}from'./collectibles.js?v=20261111-3';
const renderers=[];
for(const kind of ['puppy','bear']){const article=document.createElement('article');article.innerHTML=`<canvas aria-label="${collectibleNames[kind]}模型"></canvas><h2>${collectibleNames[kind]}</h2><p>${{puppy:'奶油色 · 垂耳 · 绿色小领结',bear:'浅棕色 · 绒面 · 雾粉生日帽'}[kind]}</p>`;document.querySelector('main').append(article);const canvas=article.querySelector('canvas');const r=new T.WebGLRenderer({canvas,antialias:true});r.setPixelRatio(Math.min(1.5,devicePixelRatio));r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;const scene=new T.Scene();scene.background=new T.Color('#e7e3d8');const camera=new T.PerspectiveCamera(35,1,.1,30);camera.position.set(1.7,2.1,6.3);camera.lookAt(0,1.15,0);scene.add(new T.HemisphereLight('#fff5df','#b5b8aa',2));const light=new T.DirectionalLight('#fff2d4',2);light.position.set(-3,5,4);light.castShadow=true;light.shadow.mapSize.set(1024,1024);scene.add(light);const fill=new T.DirectionalLight('#dcebf7',1);fill.position.set(4,2,-2);scene.add(fill);const model=createCollectible(kind);scene.add(model);const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:'#d6d3c7',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const podium=new T.Mesh(new T.CylinderGeometry(1.22,1.25,.06,80),new T.MeshStandardMaterial({color:'#eeece2',roughness:.8}));podium.position.y=-.025;podium.receiveShadow=true;scene.add(podium);let drag=null;canvas.addEventListener('pointerdown',e=>{drag=e.clientX;canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(drag!==null){model.rotation.y+=(e.clientX-drag)*.012;drag=e.clientX;}});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);const resize=()=>{const w=canvas.clientWidth,h=canvas.clientHeight;r.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();};resize();addEventListener('resize',resize);renderers.push(()=>r.render(scene,camera));}
function frame(){requestAnimationFrame(frame);renderers.forEach(fn=>fn());}frame();
</script></body></html>
